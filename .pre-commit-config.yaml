# Local hooks. The full gitleaks scan runs in CI (.github/workflows/ci.yml);
# detect-private-key is the local first line against committed keys.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # The live search ships the corpus text (about 1.8 MB), built by
        # scripts/build_search_index.py. The cap stays at 1 MB for every other file.
        exclude: ^docs/demo/corpus\.json$
      - id: end-of-file-fixer
      - id: trailing-whitespace
