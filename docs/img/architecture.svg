<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1186 472" width="1186" height="472" role="img" aria-label="Pipeline: gate, retrieve, answer, check, then an answer or a refusal, with the store feeding retrieval and the checker"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5B52"/></marker></defs><rect x="0.5" y="0.5" width="1185" height="471" rx="16" fill="#FBF8F5" stroke="#DDD5CD"/><text x="32" y="40" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2A1C16" text-anchor="start">Figure 1. How an answer is made</text><text x="32" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">One pass: retrieve, answer, check. Otis does not choose its own tools or loop.</text><rect x="30" y="92" width="120" height="170" rx="10" fill="#FFFFFF" stroke="#DDD5CD" stroke-width="1.2"/><rect x="30" y="92" width="120" height="30" rx="10" fill="#94867D"/><rect x="30" y="108" width="120" height="14" fill="#94867D"/><text x="44" y="112" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start">Question</text><text x="44" y="148" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">Free text, for</text><text x="44" y="166" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">example: &#x27;Does</text><text x="44" y="184" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">CVE-2020-9402</text><text x="44" y="202" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">affect django</text><text x="44" y="220" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">version 3.0.4?&#x27;</text><rect x="174" y="92" width="170" height="170" rx="10" fill="#FFFFFF" stroke="#DDD5CD" stroke-width="1.2"/><rect x="174" y="92" width="170" height="30" rx="10" fill="#4F93C9"/><rect x="174" y="108" width="170" height="14" fill="#4F93C9"/><text x="188" y="112" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start">1  Gate</text><text x="188" y="148" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">If the question names</text><text x="188" y="166" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">a GHSA or CVE ID that</text><text x="188" y="184" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">no record holds, refuse.</text><text x="188" y="202" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">The model is not called.</text><rect x="368" y="92" width="190" height="170" rx="10" fill="#FFFFFF" stroke="#DDD5CD" stroke-width="1.2"/><rect x="368" y="92" width="190" height="30" rx="10" fill="#4F93C9"/><rect x="368" y="108" width="190" height="14" fill="#4F93C9"/><text x="382" y="112" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start">2  Retrieve</text><text x="382" y="148" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">Keyword search (BM25)</text><text x="382" y="166" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">over 1,164 records, each</text><text x="382" y="184" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">with a short header:</text><text x="382" y="202" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">package, dates, score,</text><text x="382" y="220" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">ranges, aliases.</text><text x="382" y="238" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">The top 10 are shown.</text><rect x="582" y="92" width="190" height="170" rx="10" fill="#FFFFFF" stroke="#DDD5CD" stroke-width="1.2"/><rect x="582" y="92" width="190" height="30" rx="10" fill="#4F93C9"/><rect x="582" y="108" width="190" height="14" fill="#4F93C9"/><text x="596" y="112" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start">3  Answer</text><text x="596" y="148" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">Claude Sonnet 5.5, one</text><text x="596" y="166" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">pass, no tools. It</text><text x="596" y="184" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">writes JSON: verdict,</text><text x="596" y="202" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">IDs, value, explanation,</text><text x="596" y="220" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">and the claims the</text><text x="596" y="238" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">answer rests on.</text><rect x="796" y="92" width="200" height="170" rx="10" fill="#FFFFFF" stroke="#DDD5CD" stroke-width="1.2"/><rect x="796" y="92" width="200" height="30" rx="10" fill="#C45F72"/><rect x="796" y="108" width="200" height="14" fill="#C45F72"/><text x="810" y="112" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start">4  Check</text><text x="810" y="148" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">Code reads each claim</text><text x="810" y="166" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">against the store, not</text><text x="810" y="184" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">against the model&#x27;s text.</text><text x="810" y="202" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">One claim that is wrong</text><text x="810" y="220" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">or cannot be checked</text><text x="810" y="238" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">refuses the whole reply.</text><line x1="152" y1="177" x2="172" y2="177" stroke="#6B5B52" stroke-width="1.6" marker-end="url(#head)"/><line x1="346" y1="177" x2="366" y2="177" stroke="#6B5B52" stroke-width="1.6" marker-end="url(#head)"/><line x1="560" y1="177" x2="580" y2="177" stroke="#6B5B52" stroke-width="1.6" marker-end="url(#head)"/><line x1="774" y1="177" x2="794" y2="177" stroke="#6B5B52" stroke-width="1.6" marker-end="url(#head)"/><line x1="996" y1="150" x2="1022" y2="138" stroke="#6B5B52" stroke-width="1.6" marker-end="url(#head)"/><line x1="996" y1="205" x2="1022" y2="214" stroke="#6B5B52" stroke-width="1.6" marker-end="url(#head)"/><rect x="1024" y="92" width="130" height="74" rx="10" fill="#D6E8F7" stroke="#4F93C9" stroke-width="1.2"/><text x="1089" y="118" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2A1C16" text-anchor="middle">Answer</text><text x="1089" y="138" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B5B52" text-anchor="middle">with its claims</text><text x="1089" y="154" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B5B52" text-anchor="middle">and links</text><rect x="1024" y="182" width="130" height="80" rx="10" fill="#F7DDE1" stroke="#C45F72" stroke-width="1.2"/><text x="1089" y="208" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2A1C16" text-anchor="middle">Refusal</text><text x="1089" y="228" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B5B52" text-anchor="middle">with the reasons</text><text x="1089" y="244" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B5B52" text-anchor="middle">from the checker</text><rect x="368" y="312" width="786" height="70" rx="12" fill="#FFFFFF" stroke="#B9AFA7" stroke-width="1.2"/><text x="388" y="338" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2A1C16" text-anchor="start">Store: SQLite, snapshot of 1 November 2026</text><text x="388" y="362" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">588 GitHub advisories   576 NVD records   CISA KEV (1,766 entries)   18 packages: 9 PyPI, 6 npm, 3 Maven</text><line x1="463" y1="312" x2="463" y2="264" stroke="#6B5B52" stroke-width="1.6" marker-end="url(#head)"/><line x1="896" y1="312" x2="896" y2="264" stroke="#6B5B52" stroke-width="1.6" marker-end="url(#head)"/><text x="475" y="292" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94867D" text-anchor="start">records</text><text x="908" y="292" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94867D" text-anchor="start">facts, read afresh</text><rect x="32" y="312" width="312" height="70" rx="12" fill="#FFFFFF" stroke="#E9E3DD" stroke-width="1.2"/><text x="48" y="337" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2A1C16" text-anchor="start">Retrieval and the model answer.</text><text x="48" y="355" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2A1C16" text-anchor="start">Code only checks and grades.</text><text x="48" y="372" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94867D" text-anchor="start">ADR 0001</text><rect x="32" y="398" width="1122" height="54" rx="12" fill="#FFFFFF" stroke="#E9E3DD" stroke-width="1.2"/><text x="48" y="420" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#C45F72" text-anchor="start">Fail closed.</text><text x="124" y="420" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B5B52" text-anchor="start">A claim that is wrong, or that code cannot check, refuses the reply. The checker never repairs a fact, because patching one would be code answering the question (ADR 0006).</text><text x="48" y="440" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B5B52" text-anchor="start">Eight rules in all, from reading the reply the way the scorer does to requiring a passing claim behind every answer field.</text></svg>
