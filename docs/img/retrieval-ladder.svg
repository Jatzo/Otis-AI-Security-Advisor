d search with a header</text><rect x="400" y="162" width="420.0" height="24" rx="5" fill="#8EC1EE" stroke="none" stroke-width="0"/><line x1="724.8" y1="174" x2="887.2" y2="174" stroke="#2A1C16" stroke-width="1.4"/><line x1="724.8" y1="168" x2="724.8" y2="180" stroke="#2A1C16" stroke-width="1.4"/><line x1="887.2" y1="168" x2="887.2" y2="180" stroke="#2A1C16" stroke-width="1.4"/><text x="895.2" y="179" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2A1C16" text-anchor="start">24/32</text><text x="1040" y="179" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4F93C9" text-anchor="start">adopted</text><text x="32" y="217" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1C16" text-anchor="start">R2</text><text x="66" y="217" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1C16" text-anchor="start">Dense search, Qwen3-Embedding-0.6B</text><rect x="400" y="200" width="210.0" height="24" rx="5" fill="#B9AFA7" stroke="none" stroke-width="0"/><line x1="528.8" y1="212" x2="708.0" y2="212" stroke="#2A1C16" stroke-width="1.4"/><line x1="528.8" y1="206" x2="528.8" y2="218" stroke="#2A1C16" stroke-width="1.4"/><line x1="708.0" y1="206" x2="708.0" y2="218" stroke="#2A1C16" stroke-width="1.4"/><text x="716.0" y="217" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2A1C16" text-anchor="start">12/32</text><text x="1040" y="217" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94867D" text-anchor="start">740 ms</text><text x="32" y="255" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1C16" text-anchor="start">R3</text><text x="66" y="255" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1C16" text-anchor="start">Dense search, bge-small</text><rect x="400" y="238" width="227.5" height="24" rx="5" fill="#B9AFA7" stroke="none" stroke-width="0"/><line x1="545.6" y1="250" x2="724.8" y2="250" stroke="#2A1C16" stroke-width="1.4"/><line x1="545.6" y1="244" x2="545.6" y2="256" stroke="#2A1C16" stroke-width="1.4"/><line x1="724.8" y1="244" x2="724.8" y2="256" stroke="#2A1C16" stroke-width="1.4"/><text x="732.8" y="255" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2A1C16" text-anchor="start">13/32</text><text x="1040" y="255" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94867D" text-anchor="start">22 ms</text><text x="32" y="293" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1C16" text-anchor="start">R4</text><text x="66" y="293" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1C16" text-anchor="start">R1 + R3, reciprocal rank fusion</text><rect x="400" y="276" width="350.0" height="24" rx="5" fill="#B9AFA7" stroke="none" stroke-width="0"/><line x1="652.0" y1="288" x2="831.2" y2="288" stroke="#2A1C16" stroke-width="1.4"/><line x1="652.0" y1="282" x2="652.0" y2="294" stroke="#2A1C16" stroke-width="1.4"/><line x1="831.2" y1="282" x2="831.2" y2="294" stroke="#2A1C16" stroke-width="1.4"/><text x="839.2" y="293" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2A1C16" text-anchor="start">20/32</text><text x="32" y="331" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1C16" text-anchor="start">R5</text><text x="66" y="331" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-si