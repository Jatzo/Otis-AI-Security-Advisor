l="#2A1C16" text-anchor="start">R7</text><text x="66" y="407" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1C16" text-anchor="start">R1 with long records split</text><rect x="400" y="390" width="420.0" height="24" rx="5" fill="#B9AFA7" stroke="none" stroke-width="0"/><line x1="724.8" y1="402" x2="887.2" y2="402" stroke="#2A1C16" stroke-width="1.4"/><line x1="724.8" y1="396" x2="724.8" y2="408" stroke="#2A1C16" stroke-width="1.4"/><line x1="887.2" y1="396" x2="887.2" y2="408" stroke="#2A1C16" stroke-width="1.4"/><text x="895.2" y="407" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2A1C16" text-anchor="start">24/32</text><text x="32" y="445" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1C16" text-anchor="start">R8</text><text x="66" y="445" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1C16" text-anchor="start">R1 with model-written sub-queries</text><rect x="400" y="428" width="350.0" height="24" rx="5" fill="#B9AFA7" stroke="none" stroke-width="0"/><line x1="652.0" y1="440" x2="831.2" y2="440" stroke="#2A1C16" stroke-width="1.4"/><line x1="652.0" y1="434" x2="652.0" y2="446" stroke="#2A1C16" stroke-width="1.4"/><line x1="831.2" y1="434" x2="831.2" y2="446" stroke="#2A1C16" stroke-width="1.4"/><text x="839.2" y="445" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2A1C16" text-anchor="start">20/32</text><text x="1040" y="445" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94867D" text-anchor="start">1.7 s</text><rect x="32" y="494" width="1122" height="62" rx="10" fill="#FFFFFF" stroke="#DDD5CD" stroke-width="1.2"/><text x="48" y="518" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">Rule written before the first run: a rung is adopted only if it wins at least 4 more questions than R1, with exact McNemar p below 0.05.</text><text x="48" y="540" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B5B52" text-anchor="start">None did. R1&#x27;s header is worth 17 questions over R0. Embeddings did worse than keyword search on this set, which is full of exact IDs and versions.</text></svg>
