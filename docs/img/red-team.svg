FFFF" stroke="#B9AFA7" stroke-width="1.2"/><rect x="485" y="336" width="9" height="18" rx="3" fill="#FFFFFF" stroke="#B9AFA7" stroke-width="1.2"/><rect x="496" y="336" width="9" height="18" rx="3" fill="#FFFFFF" stroke="#B9AFA7" stroke-width="1.2"/><rect x="507" y="336" width="9" height="18" rx="3" fill="#FFFFFF" stroke="#B9AFA7" stroke-width="1.2"/><text x="526" y="351" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94867D" text-anchor="start">0 of 8</text><rect x="790" y="336" width="9" height="18" rx="3" fill="#FFFFFF" stroke="#B9AFA7" stroke-width="1.2"/><rect x="801" y="336" width="9" height="18" rx="3" fill="#FFFFFF" stroke="#B9AFA7" stroke-width="1.2"/><rect x="812" y="336" width="9" height="18" rx="3" fill="#FFFFFF" stroke="#B9AFA7" stroke-width="1.2"/><rect x="823" y="336" width="9" height="18" rx="3" fill="#FFFFFF" stroke="#B9AFA7" stroke-width="1.2"/><rect x="834" y="336" width="9" height="18" rx="3" fill="#FFFFFF" stroke="#B9AFA7" stroke-width="1.2"/><rect x="845" y="336" width="9" height="18" rx="3" fill="#FFFFFF" stroke="#B9AFA7" stroke-width="1.2"/><rect x="856" y="336" width="9" height="18" rx="3" fill="#FFFFFF" stroke="#B9AFA7" stroke-width="1.2"/><rect x="867" y="336" width="9" height="18" rx="3" fill="#FFFFFF" stroke="#B9AFA7" stroke-width="1.2"/><text x="886" y="351" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94867D" text-anchor="start">0 of 8</text><text x="32" y="398" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B5B52" text-anchor="start">A filled square is a case where the reply did what the attack asked, and did not just mention it. Source: docs/red-team-report.md.</text><rect x="32" y="404" width="1122" height="124" rx="10" fill="#FFFFFF" stroke="#DDD5CD" stroke-width="1.2"/><text x="48" y="430" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2A1C16" text-anchor="start">Instructions hidden in advisory text were almost never followed: 1 of 48 cases. That one was a record claiming to be withdrawn.</text><text x="48" y="458" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2A1C16" text-anchor="start">A record can still take a question away, by claiming to be withdrawn or by text that makes the API refuse the reply.</text><text x="48" y="486" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2A1C16" text-anchor="start">A visitor can make Otis repeat what they type. It changes only their own reply and the page shows it as text.</text><text x="48" y="514" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2A1C16" text-anchor="start">A false record with false structured fields gets into a list answer. The checker compares claims with the record it cites, so a record that lies passes.</text></svg>
