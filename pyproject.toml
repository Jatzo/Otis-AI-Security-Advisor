[project]
name = "otis-ai-security-advisor"
version = "0.1.0"
description = "Answers questions about real software vulnerabilities from public advisory data, with checked citations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic==1.15.0",
    "cvss==3.6",
    "numpy==2.5.4",
    "packaging==26.3",
]

[dependency-groups]
# The models behind dense search and reranking. Tests use a fake embedder, so CI installs the
# default groups only (dev) and never downloads torch. Install these with `uv sync --group ml`.
ml = [
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
    "transformers==5.20.1",
]
dev = [
    "hypothesis==6.170.1",
    "pytest>=8",
    # Matches the pre-commit hook, so local and CI lint agree.
    "ruff==0.17.0",
    "semver==3.1.0",
    "univers==32.0.1",
]

# On Linux the default torch wheel carries CUDA libraries (over 2 GB). The demo and CI have no GPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]  # asserts, and fake tokens that are not secrets
"eval/*" = ["S311"]  # seeded sampling for the question set, not security
"eval-v2/*" = ["S311", "S101", "E501"]  # same as eval/build_questions.py: seeded sampling, long wordings
"scripts/make_figures.py" = ["E501"]  # long sentences of figure text, copied from the written results
"scripts/measure_ingest_check.py" = ["S311"]  # a seeded sample, not a secret
"eval/build_questions.py" = ["E501"]  # question templates and derivations read better unbroken
"src/advisor/structured/__init__.py" = ["E501"]  # one template per line, matched in full
